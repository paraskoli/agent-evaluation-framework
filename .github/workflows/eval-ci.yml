name: Agent Evaluation & Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests
        run: |
          PYTHONPATH=src pytest -v tests/

      - name: Run Trajectory Benchmark Suite (CI Quality Gate)
        run: |
          PYTHONPATH=src python benchmark/run_benchmark.py --mode mock --min-pass-rate 80.0 --output-report reports/ci_benchmark_report.md

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ matrix.python-version }}
          path: reports/
